[build-system]
requires = [
  "scikit-build-core>=1.0,<2",
  "root==0.1a12",
]
build-backend = "scikit_build_core.build"

[project]
name = "higgs-combine-tool"
version = "11.0.0.post1"
description = "Experimental binary wheel for the CMS Higgs Combine tool"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "vendor/CombinedLimit/LICENSE"]
authors = [
  { name = "CMS Collaboration and higgs-combine-tool wheel contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "pandas>=2,<3",
  "PyYAML>=6,<7",
  "root==0.1a12",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.urls]
Documentation = "https://cms-analysis.github.io/HiggsAnalysis-CombinedLimit/v11.0.0/"
Source = "https://github.com/DickyChant/combine_pypi"
Upstream = "https://github.com/cms-analysis/HiggsAnalysis-CombinedLimit"

[project.scripts]
combine = "cms_combine.cli:combine"
higgs-combine-tool-doctor = "cms_combine.cli:doctor"
"combineCards.py" = "cms_combine.cli:combine_cards"
"combineTool.py" = "cms_combine.cli:combine_tool"
"commentUncerts.py" = "cms_combine.cli:comment_uncerts"
"debugChains.py" = "cms_combine.cli:debug_chains"
"fitRooFitAD.py" = "cms_combine.cli:fit_roofit_ad"
"plot1DScan.py" = "cms_combine.cli:plot_1d_scan"
"plotBSMxsBRLimit.py" = "cms_combine.cli:plot_bsm_xsbr_limit"
"plotGof.py" = "cms_combine.cli:plot_gof"
"plotImpacts.py" = "cms_combine.cli:plot_impacts"
"plotLimitGrid.py" = "cms_combine.cli:plot_limit_grid"
"plotLimits.py" = "cms_combine.cli:plot_limits"
"pruneUncerts.py" = "cms_combine.cli:prune_uncerts"
"text2workspace.py" = "cms_combine.cli:text2workspace"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
build.verbose = true
cmake.build-type = "Release"
cmake.version = ">=3.26,<5"
ninja.version = ">=1.11"
sdist.reproducible = true
sdist.exclude = ["vendor/CombinedLimit/data/**/*.root"]
wheel.packages = ["src/cms_combine"]
wheel.py-api = "py3"

[tool.cibuildwheel]
archs = ["x86_64"]
build = "cp313-manylinux_x86_64"
build-verbosity = 1
before-all = "dnf install -y boost-devel eigen3-devel"
before-build = "pip install root==0.1a12 auditwheel==6.7.0 patchelf==0.17.2.4"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }
repair-wheel-command = "python {project}/scripts/repair_wheel.py --wheel {wheel} --dest-dir {dest_dir} --plat manylinux_2_28_x86_64"
test-command = "python {project}/tests/smoke_test.py"
test-sources = ["tests"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

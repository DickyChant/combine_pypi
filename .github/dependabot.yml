# Weekly update PRs for the GitHub Actions in the workflows and the pip requirements in
# pyproject.toml. root is pinned exactly (see README); a root update needs the wheel rebuilt
# and checked, so its PR is a prompt for that, not an automatic merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
